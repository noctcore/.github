      <circle cx="1066" cy="120" r="66" fill="white"/>
      <circle cx="1092" cy="108" r="60" fill="black"/>
    </mask>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>

  <g fill="#ffffff">
    <circle cx="170" cy="66" r="1.7" opacity="0.7"/>
    <circle cx="286" cy="128" r="1.2" opacity="0.5"/>
    <circle cx="360" cy="60" r="1.4" opacity="0.6"/>
    <circle cx="520" cy="250" r="1.1" opacity="0.45"/>
    <circle cx="700" cy="72" r="1.5" opacity="0.6"/>
    <circle cx="880" cy="240" r="1.2" opacity="0.5"/>
    <circle cx="980" cy="70" r="1.3" opacity="0.55"/>
    <circle cx="1180" cy="250" r="1.4" opacity="0.6"/>
    <circle cx="1210" cy="150" r="1.1" opacity="0.4"/>
    <circle cx="120" cy="220" r="1.2" opacity="0.5"/>
  </g>

  <rect width="1280" height="320" fill="url(#accent)" mask="url(#crescent)"/>

  <text x="140" y="176" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="94" font-weight="700" fill="#eef1f8" letter-spacing="1">noctcore</text>
  <rect x="146" y="202" width="286" height="4" rx="2" fill="url(#accent)"/>
