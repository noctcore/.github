<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-labelledby="title desc">
  <title id="title">noctcore favicon</title>
  <desc id="desc">A simplified noctcore crescent and core mark.</desc>
  <defs>
    <linearGradient id="accent" x1="7" y1="6" x2="23" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8b7cff"/>
      <stop offset="1" stop-color="#4dd0e1"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#4dd0e1"/>
    </radialGradient>
    <mask id="crescentMask">
      <rect width="32" height="32" fill="black"/>
      <circle cx="15.7" cy="16" r="9.8" fill="white"/>
      <circle cx="19.5" cy="13.8" r="10" fill="black"/>
    </mask>
  </defs>
  <circle cx="15.7" cy="16" r="9.8" fill="url(#accent)" mask="url(#crescentMask)"/>
  <circle cx="17.6" cy="17.9" r="3.1" fill="url(#core)"/>
</svg>
