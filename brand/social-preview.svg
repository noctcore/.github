<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">noctcore social preview</title>
  <desc id="desc">A premium dark social preview card with the noctcore crescent core mark, wordmark, tagline, stars, and crescent moon.</desc>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080b16"/>
      <stop offset="1" stop-color="#141a30"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b7cff"/>
      <stop offset="1" stop-color="#4dd0e1"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".35" stop-color="#b9fbff"/>
      <stop offset="1" stop-color="#4dd0e1"/>
    </radialGradient>
    <filter id="coreGlow" x="-130%" y="-130%" width="360%" height="360%">
      <feGaussianBlur stdDeviation="13" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.30 0 0 0 0 0.82 0 0 0 0 0.88 0 0 0 .74 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <mask id="cornerCrescentMask">
      <rect width="1280" height="640" fill="black"/>
      <circle cx="1092" cy="130" r="56" fill="white"/>
      <circle cx="1116" cy="115" r="60" fill="black"/>
    </mask>
    <mask id="markCrescentMask">
      <rect width="1280" height="640" fill="black"/>
      <circle cx="623" cy="213" r="92" fill="white"/>
      <circle cx="659" cy="192" r="96" fill="black"/>
    </mask>
  </defs>
  <rect width="1280" height="640" fill="url(#night)"/>
  <path d="M238 143 L329 97 L430 137" fill="none" stroke="#ffffff" stroke-width="1" opacity=".12"/>
  <path d="M878 448 L966 394 L1048 428" fill="none" stroke="#ffffff" stroke-width="1" opacity=".10"/>
  <g fill="#ffffff">
    <circle cx="238" cy="143" r="1.7" opacity=".30"/>
    <circle cx="329" cy="97" r="2.2" opacity=".36"/>
    <circle cx="430" cy="137" r="1.4" opacity=".24"/>
    <circle cx="151" cy="381" r="1.4" opacity=".20"/>
    <circle cx="481" cy="474" r="1.6" opacity=".22"/>
    <circle cx="814" cy="96" r="1.4" opacity=".25"/>
    <circle cx="878" cy="448" r="1.5" opacity=".22"/>
    <circle cx="966" cy="394" r="2" opacity=".28"/>
    <circle cx="1048" cy="428" r="1.4" opacity=".20"/>
    <circle cx="1164" cy="276" r="1.6" opacity=".24"/>
  </g>
  <circle cx="1092" cy="130" r="56" fill="url(#accent)" mask="url(#cornerCrescentMask)" filter="url(#softGlow)" opacity=".92"/>
  <circle cx="623" cy="213" r="92" fill="url(#accent)" mask="url(#markCrescentMask)" filter="url(#softGlow)"/>
  <circle cx="640" cy="231" r="27" fill="url(#core)" filter="url(#coreGlow)"/>
  <circle cx="632" cy="222" r="6" fill="#ffffff" opacity=".82"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="640" y="389" fill="#eef1f8" font-size="86" font-weight="700" letter-spacing="5">noctcore</text>
    <rect x="544" y="418" width="192" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="640" y="474" fill="#9aa3c0" font-size="30" font-weight="400" letter-spacing=".2">Guardrails and tooling for AI-assisted software development</text>
  </g>
</svg>
